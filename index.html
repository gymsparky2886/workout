<style>
:root{
  --bg:#F2F3F0;--surface:#FFFFFF;--sunk:#F2F3F0;--seg-on:#FFFFFF;--ink:#161B26;--muted:#5A6372;--faint:#646D7B;--line:#C9CED5;--hair:#ECEEF1;
  --accent:#2B59C3;--accent-ink:#FFFFFF;--accent-tint:#E3EAFA;--accent-text:#1E3F8C;
  --done:#1F7A4A;--done-ink:#FFFFFF;--done-tint:#E4F2EA;--done-text:#14512F;
  --pr:#F2C230;--pr-tint:#FFF1C2;--pr-text:#5C4000;--warn:#A3361A;--warn-tint:#FBE6DF;--warn-text:#8A2C14;
  --hero:#161B26;--hero-ink:#F2F3F0;--hero-muted:#B9C0CB;--hero-bar:#3A4252;
  --pill:#161B26;--pill-ink:#F2F3F0;--scrim:rgba(22,27,38,.45);--danger:#B3261E;--danger-ink:#FFFFFF;
  --prot:#7C4DDB;--prot-text:#6A3CC8;--prot-tint:#EEE7FB;--amber-tint:#FCEBD3;--amber-text:#8A4B00;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151B;--surface:#1B2029;--sunk:#232935;--seg-on:#39404D;--ink:#EEF1F5;--muted:#A3ACBA;--faint:#7C8696;--line:#353C48;--hair:#262C37;
  --accent:#6F95EC;--accent-ink:#0D1420;--accent-tint:#1E2A45;--accent-text:#A9C1F5;
  --done:#2E9E62;--done-ink:#06140C;--done-tint:#16301F;--done-text:#8FE0B0;
  --pr:#F2C230;--pr-tint:#3A3015;--pr-text:#F5D77A;--warn:#F08A6A;--warn-tint:#3A1E16;--warn-text:#F5B49E;
  --hero:#232935;--hero-ink:#EEF1F5;--hero-muted:#A3ACBA;--hero-bar:#3A4252;--pill:#EEF1F5;--pill-ink:#12151B;--scrim:rgba(0,0,0,.6);--danger:#F2B8B5;--danger-ink:#601410;--prot:#A98BF5;--prot-text:#B9A0F8;--prot-tint:#2A2342;--amber-tint:#3A2A12;--amber-text:#F5C77A;--b-body:#20252E;--b-edge:#2C3340;--b-mus:#272D38;--b-line:#363E4B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151B;--surface:#1B2029;--sunk:#232935;--seg-on:#39404D;--ink:#EEF1F5;--muted:#A3ACBA;--faint:#7C8696;--line:#353C48;--hair:#262C37;
  --accent:#6F95EC;--accent-ink:#0D1420;--accent-tint:#1E2A45;--accent-text:#A9C1F5;
  --done:#2E9E62;--done-ink:#06140C;--done-tint:#16301F;--done-text:#8FE0B0;
  --pr:#F2C230;--pr-tint:#3A3015;--pr-text:#F5D77A;--warn:#F08A6A;--warn-tint:#3A1E16;--warn-text:#F5B49E;
  --hero:#232935;--hero-ink:#EEF1F5;--hero-muted:#A3ACBA;--hero-bar:#3A4252;--pill:#EEF1F5;--pill-ink:#12151B;--scrim:rgba(0,0,0,.6);--danger:#F2B8B5;--danger-ink:#601410;--prot:#A98BF5;--prot-text:#B9A0F8;--prot-tint:#2A2342;--amber-tint:#3A2A12;--amber-text:#F5C77A;--b-body:#20252E;--b-edge:#2C3340;--b-mus:#272D38;--b-line:#363E4B;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%;overflow-y:scroll;overscroll-behavior-y:contain;background:var(--bg);min-height:100%}
body{overscroll-behavior-y:contain}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 104px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:4px 0 calc(env(safe-area-inset-bottom,0px) + 4px)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);padding:6px 0;min-height:56px;justify-content:center}
.tabbar button{position:relative}
.tbadge{position:absolute;top:6px;left:calc(50% + 6px);width:11px;height:11px;border-radius:50%;border:2px solid var(--surface);display:none;animation:fIn .2s ease-out}
.tbadge.s-pend{display:block;background:var(--faint)}
.tbadge.s-out{display:block;background:var(--warn)}
@media (min-width:900px){.tbadge{top:2px}}
/* v77 mock 14: update badge — accent blue, pinned to the Settings icon, no layout shift */
.ticon{position:relative;display:block;width:24px;height:24px;flex:0 0 auto}
.ticon svg{display:block;width:24px;height:24px}
.ubadge{
  position:absolute;
  top:-3px;
  right:-3px;
  width:11px;
  height:11px;
  box-sizing:border-box;
  border-radius:50%;
  border:2px solid var(--surface);
  background:var(--accent);
  display:none;
  pointer-events:none;
  z-index:2;
}
html[data-upd="1"] .ubadge{display:block}
.updcard .updnow{width:100%;justify-content:center;margin:0}
.updcard .help{margin:0}
@media (min-width:900px){
  .setpage .updcard{grid-column:1/-1}
}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
@media (min-width:900px){
  body{padding-left:96px}
  .tabbar{top:0;right:auto;width:96px;grid-template-columns:none;grid-auto-rows:min-content;align-content:start;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 28px) 0 0;border-top:0;border-right:1px solid var(--line)}
  main{padding:calc(env(safe-area-inset-top,0px) + 28px) 36px 48px}
}
.big{font-family:var(--display);font-weight:800;font-size:clamp(60px,17vw,84px);line-height:.85;margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
.big.sm{font-size:clamp(48px,13vw,64px)}
.h2d{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;margin:0}
.hdr-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.date{font-size:14px;color:var(--muted)}
.pill{font-size:13px;font-weight:600;background:var(--sunk);color:var(--muted);border-radius:999px;padding:5px 12px;white-space:nowrap}
.pill.on{background:var(--pr-tint);color:var(--pr-text)}
.title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px}
.count{text-align:right;flex:0 0 auto}
.count b{font-family:var(--display);font-weight:600;font-size:34px;line-height:1}
.count b span{color:var(--faint)}
.count small{display:block;font-size:12px;color:var(--muted)}
.th{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tbig{font-size:clamp(40px,12vw,64px)}
@media (min-width:900px){.tbig{font-size:clamp(56px,6vw,84px)}}
.datebtn{border:0;background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap;min-height:40px;display:inline-flex;gap:6px;align-items:center}
.datebtn .chev{color:var(--muted);display:inline-block;width:8px;height:8px;border:0;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transform-origin:50% 50%;transition:transform .25s ease;flex:0 0 auto;margin:0 1px 0 2px;position:relative;top:-1px;font-size:0;line-height:0;box-sizing:border-box}
.datebtn .chev.up{transform:rotate(225deg)}
@media (prefers-reduced-motion:reduce){.datebtn .chev{transition:none}}
.barrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.barrow .bar{flex:1;margin:0;height:6px}
.barrow span{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.weekpanel{background:var(--surface);border-radius:16px;padding:10px 12px;margin-top:12px}
.weekpanel .wk{margin-top:6px}

/* v77 mock 10: simplified month label, centered, only when the week spans two months */
.wd .mo{display:none}
.wk-head{display:none}
.wp-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:28px}
.wp-top .wk-mo-c{grid-column:2;justify-self:center;text-align:center;font-size:12px;font-weight:700;letter-spacing:.01em;color:var(--muted);line-height:1;pointer-events:none}
.wp-top .pill{grid-column:3;justify-self:end}
.wk{position:relative}
.wk>.wk-mo-c{position:absolute;left:0;right:0;top:-28px;height:28px;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:12px;font-weight:700;letter-spacing:.01em;color:var(--muted);z-index:2}
@media (min-width:900px){
  .wk>.wk-mo-c{top:-30px;height:30px;font-size:13px}
}


/* v77 mock 11: set rows — identical size, value centered on the full row */
.set{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  justify-items:stretch;
  align-items:center;
  gap:0;
  border:0 !important;
  min-height:52px;
  padding:0;
  box-sizing:border-box;
}
.set .v,
.set .vwrap{
  width:100%;
  max-width:100%;
  text-align:center;
  padding:0 100px;
  box-sizing:border-box;
  overflow:visible;
  white-space:nowrap;
}
.set .n,
.set .r{
  position:absolute;
  top:50%;
  bottom:auto;
  transform:translateY(-50%);
  height:auto;
  max-height:calc(100% - 16px);
  display:flex;
  align-items:center;
  z-index:1;
  pointer-events:none;
  margin:0;
  box-sizing:border-box;
}
.set .n{left:14px;right:auto}
.set .r{right:14px;left:auto;min-width:0;width:auto;text-align:right}
.set.done .r svg{display:block;width:22px;height:22px}
.set.next .r{
  font-size:11px;
  font-weight:600;
  line-height:1.15;
  padding:5px 8px;
  letter-spacing:-0.02em;
  border-radius:999px;
  background:color-mix(in srgb,var(--accent-tint) 80%,var(--surface));
  color:var(--accent-text);
  white-space:nowrap;
  max-height:calc(100% - 16px);
}
.set.next{
  border:0 !important;
  box-shadow:inset 0 0 0 2px var(--accent);
}
.set:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.set .v.long{font-size:21px;letter-spacing:-0.01em}
@media (max-width:359px){
  .set .v,
  .set .vwrap{padding:0 96px}
}

/* v77 mock 12: Sessions segment */
.sesslist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sessrow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;padding:14px 16px;background:var(--surface);border-radius:16px;cursor:pointer;min-height:68px;width:100%}
.sessrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sessrow-d{display:flex;flex-direction:column;gap:2px;min-width:0}
.sessrow-d b{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.sessrow-d span{color:var(--muted);font-size:14px}
.sessrow-m{font-size:13px;color:var(--muted);text-align:right;line-height:1.35;white-space:nowrap}
.sessrow.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.sessdetail{margin-top:12px}
.sessheadr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sessback{border:0;background:none;color:var(--accent-text);font-weight:600;min-height:44px;padding:0 4px;cursor:pointer}
.sessdetail .sd-title{text-align:center;margin:4px 0 2px}
.sessdetail .sd-title b{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.03em;display:block}
.sessdetail .sd-title span{color:var(--muted);font-size:14px}
.sessdetail .wstats{margin:8px 0}
.sess-ex{margin-top:10px}
.sess-ex h3{font-size:16px;font-weight:700;text-align:center;margin:0 0 8px}
.sess-ex .set{width:100%;min-height:46px}
.sessnote{text-align:center;color:var(--muted);margin:8px 12px 0;font-size:14px}
.sessdetail .delsess{display:block;margin:12px auto 8px}
.sessempty{text-align:center;color:var(--muted);padding:48px 16px}
@media (min-width:900px){
  .sesssplit{display:grid;grid-template-columns:minmax(280px,0.9fr) minmax(0,1.2fr);gap:24px;align-items:start;margin-top:14px}
  .sesssplit .sesslist{margin-top:0;max-height:calc(100vh - 180px);overflow:auto}
  .sesssplit .sessdetail{margin-top:0;background:var(--surface);border-radius:20px;padding:18px 20px 20px}
  .sesssplit .sessback{display:none}
}

.calbox{max-height:100%;overflow:auto}
.calbox .grab{margin:2px auto 8px}
.wd.today .mo{color:var(--accent)}

.wk-mid{min-width:0}
.wk-head{display:flex;align-items:baseline;padding:0 2px 3px}
.wk-mo{font-size:12px;font-weight:700;letter-spacing:.01em;color:var(--muted)}
html[data-wkmo="a"] .wk-head{display:none}
html[data-wkmo="b"] .wd .mo{display:none}
.wk-clip{overflow:hidden;min-width:0}
.wk-track{display:flex;width:200%;will-change:transform}
.wk-pane{width:50%;flex:none;min-width:0}
.wd .mo{display:block;font-size:9px;font-weight:700;line-height:1;letter-spacing:.02em;color:var(--muted);height:11px;margin:0 0 1px;text-transform:uppercase}
.wd .mo:empty{visibility:hidden}
@keyframes wkInR{from{transform:translateX(70%);opacity:.35}to{transform:none;opacity:1}}
@keyframes wkInL{from{transform:translateX(-70%);opacity:.35}to{transform:none;opacity:1}}
.days7.wk-in-r,.wk-clip.wk-in-r{animation:wkInR .28s cubic-bezier(.2,.8,.2,1) both}
.days7.wk-in-l,.wk-clip.wk-in-l{animation:wkInL .28s cubic-bezier(.2,.8,.2,1) both}
.datehit{border:0;background:none;color:inherit;font:inherit;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px;border-radius:10px}
.datehit .chev{color:var(--muted)}
.datehit:focus-visible{outline:2px solid var(--accent)}
.cal-layer{position:fixed;inset:0;z-index:40;display:flex;justify-content:center;align-items:flex-start}
.cal-layer .scrim{position:absolute;inset:0}
.calbox{position:relative;z-index:41;background:var(--surface);width:100%;max-width:none;height:auto;max-height:100%;border-radius:24px;padding:10px 16px 16px;display:flex;flex-direction:column;gap:8px;animation:sheetUp .22s cubic-bezier(.2,.8,.2,1);box-sizing:border-box}
.cal-layer.mid .calbox{animation:none;transform:translateY(28%);opacity:.96}
.cal-layer.mid .scrim{animation:none;opacity:.55}
.cal-hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-hd b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.cal-hd .arrow{border:0;background:none;font-size:24px;color:var(--muted);min-width:44px;min-height:44px}
.cal-hd .arrow:disabled{opacity:.25;cursor:default}
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:2px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px 0}
.cal-d{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:4px 0;color:var(--ink);font-size:14px;font-weight:600;border-radius:12px}
.cal-d i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:16px;font-weight:600;border:2px solid transparent}
.cal-d.out i{color:var(--faint);font-weight:500}
.cal-d.rest i{border-color:var(--line);border-style:dashed;color:var(--muted)}
.cal-d.done i{background:var(--done);border-color:var(--done);color:var(--done-ink)}
.cal-d.today i{border-color:var(--accent);color:var(--accent)}
.cal-d.today.done i{color:var(--done-ink);border-color:var(--done)}
.cal-d.sel i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.cal-d:disabled{opacity:.38;cursor:default}
.cal-d.out:disabled{opacity:.28}
.cal-hint{font-size:12px;color:var(--muted);margin:4px 2px 0;text-align:center}
.cal-clip{overflow:hidden}
@media (min-width:600px) and (max-width:899px){
  .calbox{width:calc(100% - 36px);max-width:720px;margin:0 auto;border-radius:24px}
}
@media (min-width:900px){
  .cal-layer{align-items:flex-start;justify-content:flex-start;inset:auto;position:absolute;z-index:20}
  .calbox{border-radius:20px;padding:14px 16px 16px;box-shadow:0 16px 40px rgba(22,27,38,.18),0 0 0 1px var(--line);animation:cIn .2s ease-out;max-width:360px;width:360px;height:auto;max-height:none;margin:8px 0 0}
  .cal-layer.mid .calbox{transform:translateY(-8px) scale(.98);opacity:.4}
  .weekpanel{position:relative}
}
@media (prefers-reduced-motion:reduce){
  .days7.wk-in-r,.days7.wk-in-l,.wk-clip.wk-in-l,.wk-clip.wk-in-r,.calbox{animation:none}
}
@media (max-width:359px){
  .wd .mo{font-size:8px;height:9px}
  .wk-mo{font-size:11px}
}

.wp-top{display:flex;justify-content:flex-end;align-items:center}
.weekpanel .wp-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:28px}
.weekpanel .wp-top .wk-mo-c{grid-column:2;justify-self:center;text-align:center;font-size:12px;font-weight:700;letter-spacing:.01em;color:var(--muted);line-height:1;pointer-events:none}
.weekpanel .wp-top .pill{grid-column:3;justify-self:end}

@media (min-width:900px){.weekpanel{background:none;padding:0}.weekpanel .date{margin-top:4px}}
.rest{padding:30px 22px}
.rest-ic{font-size:30px;line-height:1;color:var(--accent-text)}
.rest-l{font-family:var(--display);font-weight:600;font-size:24px;color:var(--ink)!important}
.rest-n{color:var(--ink)!important}
.rest-n b{font-weight:600}
@keyframes prIn{0%{opacity:0;transform:translateY(-6px);box-shadow:0 0 0 0 rgba(242,194,48,.55)}60%{opacity:1;transform:none;box-shadow:0 0 0 10px rgba(242,194,48,0)}100%{box-shadow:0 0 0 0 rgba(242,194,48,0)}}
.banner.prnew{animation:prIn .9s ease-out}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pstat{background:var(--surface);border-radius:16px;padding:12px}
.pstat b{display:block;font-family:var(--display);font-weight:600;font-size:24px;line-height:1.1}
.pstat span{font-size:12px;color:var(--muted)}
.pleft{display:flex;flex-direction:column;gap:12px}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:12px 0 2px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

  }
  .calbox.closing{animation:calSheetDown .22s cubic-bezier(.2,.8,.2,1) forwards}

function exportSpreadsheet(){
  const rows=[['date','session','exercise','type','set','weight_kg','reps','seconds','tag','bar_kg','notes']];
  const keys=Object.keys(days).sort();
  keys.forEach(d=>{
    const x=days[d];if(!x)return;
    const sess=sessName(sessOfDay(d))||x.title||'';
    const note=(x.note||'').replace(/\s+/g,' ').trim();
    const ids=new Set([...Object.keys(x.sets||{}),...((x.plan||[]).map(i=>i.ex))]);
    ids.forEach(id=>{
      const e=ex(id);if(!e)return;
      const typ=exType(id);
      const sets=x.sets[id]||[];
      const bar=e.bar||'';
      sets.forEach((s,i)=>{
        if(!s||(!s.done&&s.w==null&&s.r==null&&s.t==null))return;
        const wkg=(typ==='weight'||typ==='reps'||typ==='pin')&&s.w!=null?(plan.unit==='lb'?Math.round(s.w/KG_LB*1000)/1000:s.w):'';
        const reps=typ==='time'?'':(s.r==null?'':s.r);
        const secs=typ==='time'?(s.t==null?'':s.t):'';
        const wout=(typ==='reps'&&!s.w)?'':wkg;
        rows.push([d,sess,e.name,typ,i+1,wout,reps,secs,s.tag||'',bar||'',note]);
      });
    });
  });
  const csv=rows.map(r=>r.map(v=>{const s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='workout-export.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Spreadsheet saved to your Downloads folder.');
}

  const story=kind==='story',W=1080,H=story?1920:1350;
  const c=(typeof drawShareV2==='function'?drawShareV2(d,W,H,{bg:'C',pal:'app'}):drawShareCard(d,W,H)),nm=weekPlanName(d)||'Workout';
  c.toBlob(async blob=>{if(!blob){toast('Could not make the image.');return}const f='workout-'+d+(story?'-story':'')+'.png';
    try{const file=new File([blob],f,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:nm+' workout'});return}}catch(e){if(e&&e.name==='AbortError')return}
    const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=f;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Image saved to your Downloads folder.')},'image/png');
}
