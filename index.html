:root{
  --bg:#F2F3F0;--surface:#FFFFFF;--sunk:#F2F3F0;--seg-on:#FFFFFF;--ink:#161B26;--muted:#5A6372;--faint:#646D7B;--line:#C9CED5;--hair:#ECEEF1;
  --accent:#2B59C3;--accent-ink:#FFFFFF;--accent-tint:#E3EAFA;--accent-text:#1E3F8C;
  --done:#1F7A4A;--done-ink:#FFFFFF;--done-tint:#E4F2EA;--done-text:#14512F;
  --pr:#F2C230;--pr-tint:#FFF1C2;--pr-text:#5C4000;--warn:#A3361A;--warn-tint:#FBE6DF;--warn-text:#8A2C14;
  --hero:#161B26;--hero-ink:#F2F3F0;--hero-muted:#B9C0CB;--hero-bar:#3A4252;
  --pill:#161B26;--pill-ink:#F2F3F0;--scrim:rgba(22,27,38,.45);--danger:#B3261E;--danger-ink:#FFFFFF;
  --prot:#7C4DDB;--prot-text:#6A3CC8;--prot-tint:#EEE7FB;--amber-tint:#FCEBD3;--amber-text:#8A4B00;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151B;--surface:#1B2029;--sunk:#232935;--seg-on:#39404D;--ink:#EEF1F5;--muted:#A3ACBA;--faint:#7C8696;--line:#353C48;--hair:#262C37;
  --accent:#6F95EC;--accent-ink:#0D1420;--accent-tint:#1E2A45;--accent-text:#A9C1F5;
  --done:#2E9E62;--done-ink:#06140C;--done-tint:#16301F;--done-text:#8FE0B0;
  --pr:#F2C230;--pr-tint:#3A3015;--pr-text:#F5D77A;--warn:#F08A6A;--warn-tint:#3A1E16;--warn-text:#F5B49E;
  --hero:#232935;--hero-ink:#EEF1F5;--hero-muted:#A3ACBA;--hero-bar:#3A4252;--pill:#EEF1F5;--pill-ink:#12151B;--scrim:rgba(0,0,0,.6);--danger:#F2B8B5;--danger-ink:#601410;--prot:#A98BF5;--prot-text:#B9A0F8;--prot-tint:#2A2342;--amber-tint:#3A2A12;--amber-text:#F5C77A;--b-body:#20252E;--b-edge:#2C3340;--b-mus:#272D38;--b-line:#363E4B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151B;--surface:#1B2029;--sunk:#232935;--seg-on:#39404D;--ink:#EEF1F5;--muted:#A3ACBA;--faint:#7C8696;--line:#353C48;--hair:#262C37;
  --accent:#6F95EC;--accent-ink:#0D1420;--accent-tint:#1E2A45;--accent-text:#A9C1F5;
  --done:#2E9E62;--done-ink:#06140C;--done-tint:#16301F;--done-text:#8FE0B0;
  --pr:#F2C230;--pr-tint:#3A3015;--pr-text:#F5D77A;--warn:#F08A6A;--warn-tint:#3A1E16;--warn-text:#F5B49E;
  --hero:#232935;--hero-ink:#EEF1F5;--hero-muted:#A3ACBA;--hero-bar:#3A4252;--pill:#EEF1F5;--pill-ink:#12151B;--scrim:rgba(0,0,0,.6);--danger:#F2B8B5;--danger-ink:#601410;--prot:#A98BF5;--prot-text:#B9A0F8;--prot-tint:#2A2342;--amber-tint:#3A2A12;--amber-text:#F5C77A;--b-body:#20252E;--b-edge:#2C3340;--b-mus:#272D38;--b-line:#363E4B;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-y:scroll;overscroll-behavior-y:contain}
body{overscroll-behavior-y:contain}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 104px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:4px 0 calc(env(safe-area-inset-bottom,0px) + 4px)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);padding:6px 0;min-height:56px;justify-content:center}
.tabbar button{position:relative}
.tbadge{position:absolute;top:6px;left:calc(50% + 6px);width:11px;height:11px;border-radius:50%;border:2px solid var(--surface);display:none;animation:fIn .2s ease-out}
.tbadge.s-pend{display:block;background:var(--faint)}
.tbadge.s-out{display:block;background:var(--warn)}
@media (min-width:900px){.tbadge{top:2px}}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
@media (min-width:900px){
  body{padding-left:96px}
  .tabbar{top:0;right:auto;width:96px;grid-template-columns:none;grid-auto-rows:min-content;align-content:start;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 28px) 0 0;border-top:0;border-right:1px solid var(--line)}
  main{padding:calc(env(safe-area-inset-top,0px) + 28px) 36px 48px}
}
.big{font-family:var(--display);font-weight:800;font-size:clamp(60px,17vw,84px);line-height:.85;margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
.big.sm{font-size:clamp(48px,13vw,64px)}
.h2d{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;margin:0}
.hdr-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.date{font-size:14px;color:var(--muted)}
.pill{font-size:13px;font-weight:600;background:var(--sunk);color:var(--muted);border-radius:999px;padding:5px 12px;white-space:nowrap}
.pill.on{background:var(--pr-tint);color:var(--pr-text)}
.title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px}
.count{text-align:right;flex:0 0 auto}
.count b{font-family:var(--display);font-weight:600;font-size:34px;line-height:1}
.count b span{color:var(--faint)}
.count small{display:block;font-size:12px;color:var(--muted)}
.th{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tbig{font-size:clamp(40px,12vw,64px)}
@media (min-width:900px){.tbig{font-size:clamp(56px,6vw,84px)}}
.datebtn{border:0;background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap;min-height:40px;display:inline-flex;gap:6px;align-items:center}
.datebtn .chev{color:var(--muted)}
.barrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.barrow .bar{flex:1;margin:0;height:6px}
.barrow span{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.weekpanel{background:var(--surface);border-radius:16px;padding:10px 12px;margin-top:12px}
.weekpanel .wk{margin-top:6px}
.wp-top{display:flex;justify-content:flex-end;align-items:center}
@media (min-width:900px){.weekpanel{background:none;padding:0}.weekpanel .date{margin-top:4px}}
.rest{padding:30px 22px}
.rest-ic{font-size:30px;line-height:1;color:var(--accent-text)}
.rest-l{font-family:var(--display);font-weight:600;font-size:24px;color:var(--ink)!important}
.rest-n{color:var(--ink)!important}
.rest-n b{font-weight:600}
@keyframes prIn{0%{opacity:0;transform:translateY(-6px);box-shadow:0 0 0 0 rgba(242,194,48,.55)}60%{opacity:1;transform:none;box-shadow:0 0 0 10px rgba(242,194,48,0)}100%{box-shadow:0 0 0 0 rgba(242,194,48,0)}}
.banner.prnew{animation:prIn .9s ease-out}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pstat{background:var(--surface);border-radius:16px;padding:12px}
.pstat b{display:block;font-family:var(--display);font-weight:600;font-size:24px;line-height:1.1}
.pstat span{font-size:12px;color:var(--muted)}
.pleft{display:flex;flex-direction:column;gap:12px}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:12px 0 2px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.viewing{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--pr-tint);color:var(--pr-text);border-radius:12px;padding:6px 12px;margin-top:12px;font-size:14px}
.viewing .link{color:var(--pr-text)}
.signin .x{border:0;background:none;color:var(--accent-text);font-size:18px;min-width:36px;min-height:36px}
.signin{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--accent-tint);color:var(--accent-text);border-radius:14px;padding:6px 14px;margin-bottom:12px;font-size:14px}
.wk{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;align-items:center;gap:4px;margin:14px 0 2px;max-width:520px}
.wk .arrow{border:0;background:none;font-size:24px;color:var(--muted);min-height:44px;padding:0}
.wk .arrow:disabled{opacity:.25;cursor:default}
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wd{border:0;background:none;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.wd b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:16px;font-weight:600;border:2px solid var(--line);color:var(--muted)}
.wd.rest b{border-style:dashed}
.wd.done b{background:var(--done);border-color:var(--done);color:var(--done-ink)}
.wd.miss b{border-color:var(--warn);color:var(--warn)}
.wd.today b{border-color:var(--accent);color:var(--accent)}
.wd.today.done b{color:var(--done-ink);border-color:var(--done)}
.wd.sel b{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.wd:disabled{opacity:.4;cursor:default}
details.wscore{margin:6px 0 0}
details.wscore summary{font-size:14px;color:var(--muted);cursor:pointer;padding:6px 0;min-height:32px}
details.wscore div{font-size:14px;color:var(--muted);padding:0 0 4px}
details.wscore p{margin:4px 0}
.banner{background:var(--pr-tint);color:var(--pr-text);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-top:12px}
.banner b{display:block;font-size:15px}
.banner span{font-size:13px}
.tgrid{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.acc{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.acc .card{scroll-margin-top:12px}
::view-transition-group(*){animation-duration:.3s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-image-pair(*){overflow:hidden;border-radius:18px}
::view-transition-old(*),::view-transition-new(*){height:auto;width:100%;object-fit:none;object-position:top left}
::view-transition-old(*){animation:vtOut .1s ease-out both}
::view-transition-new(*){animation:vtIn .18s ease-out .06s both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0}}
::view-transition-old(root),::view-transition-new(root){animation:none}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
.focus{order:1}
.donebox{background:var(--sunk);color:var(--done-text);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.donebox b{font-weight:600}
.session{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-tint);color:var(--accent-text);border-radius:12px;padding:8px 12px;margin-top:12px;font-size:14px}
.list{order:2;display:flex;flex-direction:column;gap:8px}
.list .row.is-active{display:none}
.list .dragi.is-active{display:none}
@media (min-width:900px){
  .tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:start}
  .focus{order:2;position:sticky;top:24px;max-height:calc(100vh - 48px);overflow-y:auto;border-radius:20px}
  .list{order:1}
  .list .row.is-active{display:flex;box-shadow:inset 0 0 0 2px var(--accent)}
.list .dragi.is-active{display:grid;box-shadow:inset 0 0 0 2px var(--accent)}
.list .dragi.is-active .row{box-shadow:none}
}
.card{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.addform{scroll-margin-bottom:calc(env(safe-area-inset-bottom,0px) + 104px)}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goal{font-size:13px;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;border-radius:8px;padding:4px 9px;background:var(--sunk);color:var(--muted)}
.chip.next{background:var(--accent-tint);color:var(--accent-text);font-weight:600}
.why{font-size:12px;color:var(--muted);margin-top:-4px}
.flag{align-self:flex-start;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--warn);color:var(--warn)}
.note{font-size:14px;background:var(--sunk);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.set{all:unset;box-sizing:border-box;min-height:52px;border-radius:14px;display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;padding:0 14px;cursor:pointer;gap:8px}
.set .n{font-size:13px}
.set .v{font-family:var(--display);font-weight:600;font-size:25px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set .r{font-size:13px;font-weight:600;text-align:right;min-width:22px}
.set.done{background:var(--done-tint);color:var(--done-text)}
.set.done .r{color:var(--done)}
.set.next{border:2px dashed var(--accent)}
.set.next .v,.set.next .r{color:var(--accent-text)}
.set.next .n{color:var(--muted)}
.set.later{background:var(--sunk);color:var(--muted)}
.set.later .v{color:var(--faint)}
.set:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.links{display:flex;flex-wrap:wrap;gap:0 18px;font-size:14px}
.link{border:0;background:none;color:var(--accent-text);font-weight:600;padding:6px 0;min-height:40px}
.link.muted{color:var(--muted);font-weight:500}
.editor{background:var(--sunk);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.stepper{display:grid;grid-template-columns:76px 48px minmax(0,1fr) 48px;align-items:center;gap:8px}
.stepper label{font-size:13px;color:var(--muted)}
.stepper button{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:24px;line-height:1}
.stepper input{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center;font-family:var(--display);font-size:26px;font-weight:600;width:100%;min-width:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.edbtns{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.edbtns .btn{padding:0 8px}
.links.more{margin-top:-6px}
.btn{border:1px solid var(--line);border-radius:12px;padding:0 16px;min-height:44px;font-weight:600;background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--danger);color:var(--danger-ink);border-color:var(--danger)}
.askbox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;background:var(--surface);border-radius:20px;padding:20px;width:min(420px,calc(100vw - 32px));max-height:86vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}

.askbtns{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.askbtns .btn{width:100%;min-height:48px}
.editbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:15;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent-tint);color:var(--accent-text);border-radius:14px;padding:8px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}

.editbar .eb-b{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1 1 auto}

.ro{display:flex;flex-direction:column}
.rorow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair)}

.bkrow{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--hair)}
.bkrow:last-child{border-bottom:0}
.bkrow small{color:var(--muted);font-size:13px}

.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.small-center{text-align:center}
.field label,.flabel{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.inp{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.formgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

.ph{display:flex;justify-content:space-between;align-items:center;gap:12px}
.iconbtn{width:44px;height:44px;border-radius:999px;border:0;background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:0 0 auto}

  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),st=stats(d),nm=weekPlanName(d)||'Workout';
  const th=document.documentElement.getAttribute('data-theme'),dk=th==='dark'||(th!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  const C=dk?{bg:'#12151B',card:'#1B2029',ink:'#EEF1F5',mut:'#A3ACBA',faint:'#7C8696',gold:'#F2C230',goldT:'#F5D77A',green:'#8FE0B0',amber:'#F5C77A',line:'#262C37',ib:'#111216',ie:'#353C48'}:{bg:'#F2F3F0',card:'#FFFFFF',ink:'#161B26',mut:'#5A6372',faint:'#646D7B',gold:'#D9A400',goldT:'#7A5A00',green:'#1F7A4A',amber:'#8A5A12',line:'#DDE1E6',ib:'#111216',ie:'#111216'};
  const disp='"Barlow Condensed","Arial Narrow",Arial,sans-serif',body='Inter,system-ui,Arial,sans-serif',L=80;
  g.fillStyle=C.bg;g.fillRect(0,0,W,H);g.fillStyle=C.gold;g.fillRect(0,0,W,12);
  const dt=parse(d);g.fillStyle=C.mut;g.font='500 38px '+body;g.fillText(DAYS[dt.getDay()]+' '+dt.getDate()+' '+MONTHS[dt.getMonth()]+' '+dt.getFullYear(),L,120);
  g.fillStyle=C.ink;let fs=180;g.font='800 '+fs+'px '+disp;while(g.measureText(nm).width>W-2*L&&fs>90){fs-=10;g.font='800 '+fs+'px '+disp}g.fillText(nm,L-6,120+fs*.92);
  let y=150+fs;const vol=Math.round(dayVol(d)),boxes=[[String(st.n),st.n===1?'set':'sets'],[vol.toLocaleString()+' '+plan.unit,'lifted']],bw=(W-2*L-30)/2;
  boxes.forEach(([v,l],k)=>{const X=L+k*(bw+30);g.fillStyle=C.card;roundRect(g,X,y,bw,170,28);g.fill();g.fillStyle=C.ink;let f2=76;g.font='700 '+f2+'px '+disp;while(g.measureText(v).width>bw-60&&f2>40){f2-=4;g.font='700 '+f2+'px '+disp}g.fillText(v,X+30,y+95);g.fillStyle=C.mut;g.font='500 32px '+body;g.fillText(l,X+30,y+140)});
  y+=230;const pr=prs(d).filter(p=>p.tp.tag!=='drop');
  if(pr.length){g.fillStyle=C.gold;g.font='700 28px '+body;g.fillText(pr.length>1?'NEW PRS':'NEW PR',L,y);y+=56;pr.slice(0,2).forEach(p=>{g.fillStyle=C.goldT;g.font='700 46px '+body;g.fillText(exName(p.id)+'  '+fmtSet(p.t,p.tp),L,y);y+=60});y+=10}
  const r=race(d),sk=d===today()?streak():0,bits=[];if(r&&r.final)bits.push(r.pct>0?'Beat last '+nm+' by '+r.pct+'%':r.pct===0?'Matched last '+nm:'Short of last '+nm+' by '+(-r.pct)+'%');if(sk>1)bits.push(sk+' day streak');
  if(bits.length){g.fillStyle=r&&r.final&&r.pct<0?C.amber:C.green;g.font='600 38px '+body;g.fillText(bits.join(' · '),L,y);y+=70}
  const cnt={};visibleItems(d).forEach(it=>{if(doneSets(d,it.ex).length)exMuscles(it.ex).forEach(m=>cnt[m]=1)});
  const exs=visibleItems(d).filter(it=>doneSets(d,it.ex).length);let ey=y+10;const two=exs.length>5;
  g.fillStyle=C.mut;g.font='600 28px '+body;g.fillText(exs.length+(exs.length===1?' EXERCISE':' EXERCISES'),L,ey);ey+=24;
  const fit=(txt,w)=>{let t=txt;if(g.measureText(t).width<=w)return t;while(t.length>2&&g.measureText(t+'…').width>w)t=t.slice(0,-1);return t.trimEnd()+'…'};
  const drawEx=(it,x,yy,w,first,nf,sf,rh)=>{const ds=doneSets(d,it.ex),t=exType(it.ex);if(!first){g.fillStyle=C.line;g.fillRect(x,yy,w,2)}
    g.fillStyle=C.ink;g.font='600 '+nf+'px '+body;g.fillText(fit(exName(it.ex),w),x,yy+nf+10);
    g.fillStyle=C.mut;g.font='500 '+sf+'px '+body;g.fillText(fit(listTxt(t,ds),w),x,yy+nf+sf+20)};
  const avail=H-170-ey;
  if(!two){const rowH=104,maxRows=Math.max(1,Math.floor(avail/rowH));exs.slice(0,maxRows).forEach((it,k)=>{drawEx(it,L,ey,W-2*L,k===0,40,32,rowH);ey+=rowH});
    if(exs.length>maxRows){g.fillStyle=C.faint;g.font='500 30px '+body;g.fillText('+'+(exs.length-maxRows)+' more',L,ey+40)}}
  else{const rowH=88,per=Math.max(1,Math.floor(avail/rowH)),cap=per*2,shown=exs.slice(0,cap),left=Math.ceil(shown.length/2),cw=(W-2*L-44)/2;
    shown.forEach((it,k)=>{const col=k<left?0:1,row=col?k-left:k;drawEx(it,L+col*(cw+44),ey+row*rowH,cw,row===0,34,27,rowH)});
    if(exs.length>cap){g.fillStyle=C.faint;g.font='500 28px '+body;g.fillText('+'+(exs.length-cap)+' more',L,ey+left*rowH+36)}}
  const ms=MUSCLES.filter(m=>cnt[m]);if(ms.length){g.fillStyle=C.faint;g.font='500 30px '+body;let mt=ms.join(', ');while(g.measureText(mt).width>W-2*L-120&&mt.length>4)mt=mt.slice(0,-2)+'…';g.fillText(mt,L,H-62)}
  // app icon
  const ix=W-L-72,iy=H-110;g.fillStyle=C.ib;roundRect(g,ix,iy,72,72,18);g.fill();g.strokeStyle=C.ie;g.lineWidth=2;g.stroke();g.fillStyle='#FFFFFF';roundRect(g,ix+14,iy+22,6,28,3);g.fill();roundRect(g,ix+52,iy+22,6,28,3);g.fill();g.fillRect(ix+24,iy+34,24,5);g.fillStyle='#F2C230';roundRect(g,ix+21,iy+27,5,18,2);g.fill();roundRect(g,ix+46,iy+27,5,18,2);g.fill();
  c.toBlob(async blob=>{if(!blob){toast('Could not make the image.');return}const f='workout-'+d+'.png';
    try{const file=new File([blob],f,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:nm+' workout'});return}}catch(e){if(e&&e.name==='AbortError')return}
    const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=f;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Image saved to your Downloads folder.')},'image/png');
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function backupJson(){return JSON.stringify({app:'workout-tracker',v:3,saved:new Date().toISOString(),plan,days})}
function exportData(){
  const f='workout-backup-'+today()+'.json';
  try{const u=URL.createObjectURL(new Blob([backupJson()],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download=f;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
    toast('Saved to your Downloads folder: '+f)}catch(e){toast('Could not save the file. Try Share backup file instead.')}
}
function shareFile(){const f='workout-backup-'+today()+'.txt';try{return new File([backupJson()],f,{type:'text/plain'})}catch(e){return null}}
function canShareFile(){try{const x=shareFile();return !!(x&&navigator.canShare&&navigator.canShare({files:[x]}))}catch(e){return false}}
function shareData(){const x=shareFile();if(!x||!canShareFile()){toast('Sharing files isn’t available here. Use Save backup file.');return}
  navigator.share({files:[x],title:x.name}).then(()=>toast('Backup shared.')).catch(e=>{if(e&&e.name==='AbortError')toast('Sharing cancelled.');else toast('Could not share. Use Save backup file.')})}
function importData(d){
  if(!d||d.app!=='workout-tracker')throw 0;
  confirmAsk('Load this backup?','Everything goes back to the backup from '+String(d.saved||'').slice(0,10)+', on this device and online.','Load backup').then(ok=>{if(!ok)return;
    try{withUndo('Backup loaded.',()=>applyData(d));setView('today')}catch(x){toast('That file is not a workout backup.')}render()});
}
function applyData(d){
  let np,nd={};
  if(d.v===3&&d.plan&&d.days){np=normPlan(d.plan);Object.entries(d.days).forEach(([k,v])=>{nd[k]=normDay(v)})}
  else if(d.plan&&d.logs){
    const op=d.plan,lb=op.unit==='lb',p={unit:op.unit,theme:op.theme,library:{},week:op.week};
    Object.entries(op.library||{}).forEach(([k,name])=>{p.library[k]={name:String(name),type:(op.types||{})[k]||'weight',note:(op.notes||{})[k]||''}});
    np=normPlan(p);
    Object.values(d.logs||{}).forEach(m=>Object.entries(m||{}).forEach(([k,v])=>{const x=normDay(v);x.plan=null;
      Object.keys(x.sets).forEach(id=>{x.sets[id]=(x.sets[id]||[]).filter(s=>s&&typeof s==='object').map(s=>({w:s.w==null?null:(lb?s.w/KG_LB:s.w),r:s.r==null?null:s.r,t:s.t==null?null:s.t,done:!!s.done}))});
      nd[k]=x}));
  }else throw 0;
  const old=Object.keys(days);plan=np;days=nd;
  if(d.logs)Object.keys(days).forEach(k=>{days[k].plan=clone(weekItems(k))});
  const ds=Object.keys(days).sort();if(!plan.startedOn)plan.startedOn=ds[0]||(hasContent(plan)?today():null);
  old.forEach(k=>{if(!days[k])days[k]=normDay()});
  dedupeLibrary();applyTheme(plan.theme);LS.set('session',null);savePlan();Object.keys(days).forEach(k=>{dirtyDays.add(k);replaceDays.add(k)});saveLocal();flush();viewKey=today();
}
/* ---------------- automatic backups ---------------- */
const BK_KEEP=7;
function setsCount(dd){let n=0;Object.values(dd||{}).forEach(x=>Object.values((x&&x.sets)||{}).forEach(a=>(a||[]).forEach(s=>{if(s&&s.done)n++})));return n}
function autoBackup(){
  if(!hasContent(plan))return;const t=today(),list=LS.get('bk')||[];
  if(!list.length||list[0].date!==t){
    list.unshift({date:t,sets:setsCount(days),data:{app:'workout-tracker',v:3,saved:new Date().toISOString(),plan:clone(plan),days:clone(days)}});
    while(list.length>BK_KEEP)list.pop();while(list.length>1&&JSON.stringify(list).length>2000000)list.pop();LS.set('bk',list);
  }
  if(user&&fdb&&LS.get('bkCloud')!==list[0].date)cloudBackup(list[0]);
}
function cloudBackup(b){const js=JSON.stringify(b.data);if(js.length>900000)return;const col=fdb.collection('users/'+user.uid+'/backups');
  col.doc(b.date).set({date:b.date,sets:b.sets,json:js}).then(()=>{LS.set('bkCloud',b.date);bkCloudList=null;return col.orderBy('date','desc').get()}).then(q=>{if(q)q.docs.slice(BK_KEEP).forEach(x=>x.ref.delete())}).catch(()=>{})}
function loadCloudBackups(){if(!user||!fdb||bkCloudList)return;bkCloudList='loading';
  fdb.collection('users/'+user.uid+'/backups').orderBy('date','desc').limit(BK_KEEP).get().then(q=>{bkCloudList=q.docs.map(x=>x.data());if(view==='settings')softRender()}).catch(()=>{bkCloudList=[]})}
function backupList(){if(user&&Array.isArray(bkCloudList)&&bkCloudList.length)return bkCloudList.map(b=>({date:b.date,sets:b.sets,src:'cloud'}));return (LS.get('bk')||[]).map(b=>({date:b.date,sets:b.sets,src:'local'}))}
function restoreBackup(src,date){
  const go=data=>confirmAsk('Restore '+fmtDate(date)+'?','Everything goes back to how it was when you opened the app that day, on this device and online.','Restore').then(ok=>{if(ok)withUndo('Backup restored.',()=>applyData(data))});
  if(src==='local'){const b=(LS.get('bk')||[]).find(x=>x.date===date);if(b)go(b.data);return}
  const b=(bkCloudList||[]).find(x=>x.date===date);if(b){try{go(JSON.parse(b.json))}catch(e){toast('That backup could not be read.')}}
}
/* ---------------- drag to reorder ---------------- */
let drag=null,dragAuto=null;
const DRAGSEL='.prow,.dragi,.sesscard';
function dragItems(list){return [...list.children].filter(e=>e.matches(DRAGSEL))}
function tyOf(x){const m=(x.style.transform||'').match(/translateY\((-?[\d.]+)px\)/);return m?parseFloat(m[1]):0}
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.handle');if(!h)return;const el=h.closest(DRAGSEL);if(!el)return;e.preventDefault();
  const r=el.getBoundingClientRect();drag={el,list:el.parentElement,grab:e.clientY-r.top,ty:0,y:e.clientY,moved:false};el.classList.add('dragging');try{h.setPointerCapture(e.pointerId)}catch(x){}
  clearInterval(dragAuto);dragAuto=setInterval(()=>{if(!drag)return;const sp=drag.y<80?-10:drag.y>window.innerHeight-110?10:0;if(sp){window.scrollBy(0,sp);dragStep()}},16)});
function flipTo(el,list,ref){const sib=dragItems(list).filter(x=>x!==el),before=new Map(sib.map(x=>[x,x.getBoundingClientRect().top-tyOf(x)]));
  if(ref)list.insertBefore(el,ref);else{const its=sib;const last=its[its.length-1];if(last)last.after(el)}
  if(!smoothOK())return;sib.forEach(x=>{const d=before.get(x)-x.getBoundingClientRect().top+tyOf(x);if(Math.abs(d)>.5){x.style.transition='none';x.style.transform='translateY('+d+'px)';void x.offsetWidth;x.style.transition='transform .22s cubic-bezier(.2,.8,.2,1)';x.style.transform=''}})}
function dragStep(){if(!drag)return;const {el,list}=drag,y=drag.y,sib=dragItems(list).filter(x=>x!==el);let ref=null;
  for(const x of sib){const b=x.getBoundingClientRect(),top=b.top-tyOf(x);if(y<top+b.height/2){ref=x;break}}
  let cur=el.nextElementSibling;while(cur&&!cur.matches(DRAGSEL))cur=cur.nextElementSibling;
  if(ref!==cur&&!(ref===null&&!cur)){flipTo(el,list,ref);drag.moved=true}
  el.style.transition='none';const natural=el.getBoundingClientRect().top-drag.ty;drag.ty=y-drag.grab-natural;el.style.transform='translateY('+drag.ty+'px)'}
document.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();drag.y=e.clientY;dragStep()},{passive:false});
function endDrag(){if(!drag)return;clearInterval(dragAuto);const {el,list}=drag;drag=null;
  const fin=()=>{el.classList.remove('dragging');el.style.transition='';el.style.transform='';dragItems(list).forEach(x=>{x.style.transition='';x.style.transform=''});
    if(el.matches('.sesscard')){const ord=dragItems(list).map(x=>x.dataset.sess);if(ord.join()!==sessList().join()){plan.order=ord;savePlan()}render();return}
    if(el.matches('.dragi')){const ord=dragItems(list).map(x=>x.dataset.ex);const curOrd=visibleItems(viewKey).map(i=>i.ex);if(ord.join()!==curOrd.join()){const x=snap(viewKey);x.order=ord;touchDay(viewKey)}render();return}
    const order=dragItems(list).map(r=>+r.dataset.row),w=curSess(),old=w.items;if(order.some((v,i)=>v!==i)){w.items=order.map(i=>old[i]).concat(old.filter((_,i)=>!order.includes(i)));savePlan()}render()};
  if(smoothOK()){el.style.transition='transform .2s cubic-bezier(.2,.8,.2,1)';el.style.transform='';setTimeout(fin,210)}else fin()}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',e=>{const h=e.target.closest&&e.target.closest('.handle');if(!h||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;e.preventDefault();
  const i=+h.dataset.i,j=e.key==='ArrowUp'?i-1:i+1,it=curSess().items;if(j<0||j>=it.length)return;[it[i],it[j]]=[it[j],it[i]];savePlan();render();const n=document.querySelector('.handle[data-i="'+j+'"]');n&&n.focus()});

/* ---------------- start ---------------- */
{const rawPlan=LS.get('plan');plan=normPlan(rawPlan);if(rawPlan&&!rawPlan.sessions&&sessList().length)LS.set('plan',plan),setTimeout(()=>savePlan(),0)}
Object.entries(LS.get('days')||{}).forEach(([k,v])=>{days[k]=normDay(v)});
viewKey=homeDay();
let uiScroll=null;
try{const u=JSON.parse(localStorage.getItem('wt3:ui')||'null');if(u&&Date.now()-u.t<AWAY_MS){if(!location.hash&&u.view&&VIEWS.includes(u.view)&&u.view!==view)setView(u.view);if(u.progEx)progEx=u.progEx;if(u.planDay!=null)planDay=u.planDay;if(u.viewKey&&u.viewKey<=today()){viewKey=u.viewKey;weekOff=u.weekOff||0}if(u.yearSel)yearSel=u.yearSel;if(u.view===view)uiScroll=u.scroll}}catch(e){}
function saveUI(){try{localStorage.setItem('wt3:ui',JSON.stringify({t:Date.now(),view,progEx,planDay,viewKey,weekOff,yearSel,scroll:window.scrollY}))}catch(e){}}
window.addEventListener('pagehide',saveUI);window.addEventListener('beforeunload',saveUI);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveUI()});
applyTheme(plan.theme);autoBackup();render();dedupeLibrary();prReady=true;initFirebase();armBack();
try{const qp=new URLSearchParams(location.search);if(qp.get('protein')){setView('today');protOpen=true;render()}if(qp.toString())history.replaceState(history.state,'',location.pathname+location.hash)}catch(e){}
if(uiScroll){const go=()=>window.scrollTo(0,uiScroll);requestAnimationFrame(go);setTimeout(go,120);setTimeout(go,400)}
let lastDay=today(),hiddenAt=0;
setInterval(()=>{const t=today();if(t!==lastDay){if(viewKey===lastDay&&!sessionActive(lastDay))viewKey=t;lastDay=t;softRender()}},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){hiddenAt=Date.now();saveNow();return}
  autoBackup();const t=today();if(hiddenAt&&Date.now()-hiddenAt>AWAY_MS){viewKey=homeDay();weekOff=0;editor=null;addOpen=false;noteOpen=null}else if(t!==lastDay&&viewKey===lastDay&&!sessionActive(lastDay))viewKey=t;lastDay=t;softRender()});
if('serviceWorker' in navigator){const hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl)showUpdate()});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{})})}).catch(()=>{}))}
function showUpdate(){if($('#updbar'))return;const b=document.createElement('button');b.id='updbar';b.className='updbar';b.innerHTML='New version ready · <b>Tap to refresh</b>';b.onclick=()=>{try{saveNow();saveUI()}catch(e){}location.reload()};document.body.appendChild(b)}
})();
</script>
