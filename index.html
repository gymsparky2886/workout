<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout</title>
<meta name="theme-color" content="#F2F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F0;--surface:#FFFFFF;--sunk:#F2F3F0;--seg-on:#FFFFFF;--ink:#161B26;--muted:#5A6372;--faint:#8A93A1;--line:#DADDE2;--hair:#ECEEF1;
  --accent:#2B59C3;--accent-ink:#FFFFFF;--accent-tint:#E3EAFA;--accent-text:#1E3F8C;
  --done:#1F7A4A;--done-ink:#FFFFFF;--done-tint:#E4F2EA;--done-text:#14512F;
  --pr:#F2C230;--pr-tint:#FFF1C2;--pr-text:#5C4000;--warn:#A3361A;--warn-tint:#FBE6DF;--warn-text:#8A2C14;
  --hero:#161B26;--hero-ink:#F2F3F0;--hero-muted:#B9C0CB;--hero-bar:#3A4252;
  --pill:#161B26;--pill-ink:#F2F3F0;--scrim:rgba(22,27,38,.45);--danger:#B3261E;--danger-ink:#FFFFFF;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151B;--surface:#1B2029;--sunk:#232935;--seg-on:#39404D;--ink:#EEF1F5;--muted:#A3ACBA;--faint:#7C8696;--line:#2C3340;--hair:#262C37;
  --accent:#6F95EC;--accent-ink:#0D1420;--accent-tint:#1E2A45;--accent-text:#A9C1F5;
  --done:#2E9E62;--done-ink:#06140C;--done-tint:#16301F;--done-text:#8FE0B0;
  --pr:#F2C230;--pr-tint:#3A3015;--pr-text:#F5D77A;--warn:#F08A6A;--warn-tint:#3A1E16;--warn-text:#F5B49E;
  --hero:#232935;--hero-ink:#EEF1F5;--hero-muted:#A3ACBA;--hero-bar:#3A4252;--pill:#EEF1F5;--pill-ink:#12151B;--scrim:rgba(0,0,0,.6);--danger:#F2B8B5;--danger-ink:#601410;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151B;--surface:#1B2029;--sunk:#232935;--seg-on:#39404D;--ink:#EEF1F5;--muted:#A3ACBA;--faint:#7C8696;--line:#2C3340;--hair:#262C37;
  --accent:#6F95EC;--accent-ink:#0D1420;--accent-tint:#1E2A45;--accent-text:#A9C1F5;
  --done:#2E9E62;--done-ink:#06140C;--done-tint:#16301F;--done-text:#8FE0B0;
  --pr:#F2C230;--pr-tint:#3A3015;--pr-text:#F5D77A;--warn:#F08A6A;--warn-tint:#3A1E16;--warn-text:#F5B49E;
  --hero:#232935;--hero-ink:#EEF1F5;--hero-muted:#A3ACBA;--hero-bar:#3A4252;--pill:#EEF1F5;--pill-ink:#12151B;--scrim:rgba(0,0,0,.6);--danger:#F2B8B5;--danger-ink:#601410;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-y:scroll}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 104px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:4px 0 calc(env(safe-area-inset-bottom,0px) + 4px)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);padding:6px 0;min-height:56px;justify-content:center}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
@media (min-width:900px){
  body{padding-left:96px}
  .tabbar{top:0;right:auto;width:96px;grid-template-columns:none;grid-auto-rows:min-content;align-content:start;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 28px) 0 0;border-top:0;border-right:1px solid var(--line)}
  main{padding:calc(env(safe-area-inset-top,0px) + 28px) 36px 48px}
}
.big{font-family:var(--display);font-weight:800;font-size:clamp(60px,17vw,84px);line-height:.85;margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
.big.sm{font-size:clamp(48px,13vw,64px)}
.h2d{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;margin:0}
.hdr-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.date{font-size:14px;color:var(--muted)}
.pill{font-size:13px;font-weight:600;background:var(--pill);color:var(--pill-ink);border-radius:999px;padding:5px 12px;white-space:nowrap}
.title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px}
.count{text-align:right;flex:0 0 auto}
.count b{font-family:var(--display);font-weight:600;font-size:34px;line-height:1}
.count b span{color:var(--faint)}
.count small{display:block;font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:12px 0 2px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.viewing{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--pr-tint);color:var(--pr-text);border-radius:12px;padding:6px 12px;margin-top:12px;font-size:14px}
.viewing .link{color:var(--pr-text)}
.signin .x{border:0;background:none;color:var(--accent-text);font-size:18px;min-width:36px;min-height:36px}
.signin{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--accent-tint);color:var(--accent-text);border-radius:14px;padding:6px 14px;margin-bottom:12px;font-size:14px}
.wk{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;align-items:center;gap:4px;margin:14px 0 2px;max-width:520px}
.wk .arrow{border:0;background:none;font-size:24px;color:var(--muted);min-height:44px;padding:0}
.wk .arrow:disabled{opacity:.25;cursor:default}
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wd{border:0;background:none;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.wd b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:16px;font-weight:600;border:2px solid var(--line);color:var(--muted)}
.wd.rest b{border-style:dashed}
.wd.done b{background:var(--done);border-color:var(--done);color:var(--done-ink)}
.wd.miss b{border-color:var(--warn);color:var(--warn)}
.wd.today b{border-color:var(--accent);color:var(--accent)}
.wd.today.done b{color:var(--done-ink);border-color:var(--done)}
.wd.sel b{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.wd:disabled{opacity:.4;cursor:default}
details.wscore{margin:6px 0 0}
details.wscore summary{font-size:14px;color:var(--muted);cursor:pointer;padding:6px 0;min-height:32px}
details.wscore div{font-size:14px;color:var(--muted);padding:0 0 4px}
details.wscore p{margin:4px 0}
.banner{background:var(--pr-tint);color:var(--pr-text);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-top:12px}
.banner b{display:block;font-size:15px}
.banner span{font-size:13px}
.tgrid{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.acc{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.acc .card{scroll-margin-top:12px}
.focus{order:1}
.donebox{background:var(--done-tint);color:var(--done-text);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.donebox b{font-weight:600}
.session{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-tint);color:var(--accent-text);border-radius:12px;padding:8px 12px;margin-top:12px;font-size:14px}
.list{order:2;display:flex;flex-direction:column;gap:8px}
.list .row.is-active{display:none}
@media (min-width:900px){
  .tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:start}
  .focus{order:2;position:sticky;top:24px;max-height:calc(100vh - 48px);overflow-y:auto;border-radius:20px}
  .list{order:1}
  .list .row.is-active{display:flex;box-shadow:inset 0 0 0 2px var(--accent)}
}
.card{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goal{font-size:13px;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;border-radius:8px;padding:4px 9px;background:var(--sunk);color:var(--muted)}
.chip.next{background:var(--accent-tint);color:var(--accent-text);font-weight:600}
.why{font-size:12px;color:var(--muted);margin-top:-4px}
.flag{align-self:flex-start;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--warn);color:var(--warn)}
.note{font-size:14px;background:var(--sunk);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.set{all:unset;box-sizing:border-box;min-height:52px;border-radius:14px;display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;padding:0 14px;cursor:pointer;gap:8px}
.set .n{font-size:13px}
.set .v{font-family:var(--display);font-weight:600;font-size:25px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set .r{font-size:13px;font-weight:600;text-align:right;min-width:22px}
.set.done{background:var(--done);color:var(--done-ink)}
.set.next{border:2px dashed var(--accent)}
.set.next .v,.set.next .r{color:var(--accent-text)}
.set.next .n{color:var(--muted)}
.set.later{background:var(--sunk);color:var(--muted)}
.set.later .v{color:var(--faint)}
.set:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.links{display:flex;flex-wrap:wrap;gap:0 18px;font-size:14px}
.link{border:0;background:none;color:var(--accent-text);font-weight:600;padding:6px 0;min-height:40px}
.link.muted{color:var(--muted);font-weight:500}
.editor{background:var(--sunk);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.stepper{display:grid;grid-template-columns:76px 48px minmax(0,1fr) 48px;align-items:center;gap:8px}
.stepper label{font-size:13px;color:var(--muted)}
.stepper button{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:24px;line-height:1}
.stepper input{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center;font-family:var(--display);font-size:26px;font-weight:600;width:100%;min-width:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:12px;padding:0 16px;min-height:44px;font-weight:600;background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--danger);color:var(--danger-ink);border-color:var(--danger)}
.askbox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;background:var(--surface);border-radius:20px;padding:20px;width:min(420px,calc(100vw - 32px));max-height:86vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.askbox p{margin:0;color:var(--muted);white-space:pre-line}
.askbtns{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.askbtns .btn{width:100%;min-height:48px}
.editbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-tint);color:var(--accent-text);border-radius:14px;padding:8px 12px;margin:12px 0;font-weight:600}
.editbar .btns .btn{min-height:40px}
.ro{display:flex;flex-direction:column}
.rorow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair)}
.rorow:last-child{border-bottom:0}
.rorow b{display:block;font-weight:600}
.rorow small{display:block;font-size:12px;color:var(--muted)}
.rorow .g{font-family:var(--display);font-weight:600;font-size:20px;white-space:nowrap}
.bkrow{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--hair)}
.bkrow:last-child{border-bottom:0}
.bkrow small{color:var(--muted);font-size:13px}
.row{all:unset;box-sizing:border-box;background:var(--surface);border-radius:16px;padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;min-height:62px}
.row .nm{display:block;font-weight:600}
.row .sub{display:block;font-size:13px;color:var(--muted)}
.row .cnt{font-size:13px;color:var(--muted);white-space:nowrap}
.row.done{background:var(--done-tint)}
.row.done .nm,.row.done .cnt,.row.done .sub{color:var(--done-text)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ghost{all:unset;box-sizing:border-box;text-align:center;border:2px dashed var(--line);border-radius:16px;padding:14px;color:var(--muted);font-weight:600;cursor:pointer}
.small-center{text-align:center}
.field label,.flabel{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.inp{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.formgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.formgrid .wide{grid-column:1/-1}
.restcard,.empty{background:var(--surface);border-radius:20px;padding:26px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:14px}
.restcard p,.empty p{margin:0;color:var(--muted)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px}
.iconbtn{width:44px;height:44px;border-radius:999px;border:0;background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:0 0 auto}
.daypills{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:16px 0 12px}
.dp{border:0;background:var(--surface);border-radius:10px;padding:6px 0;font-size:13px;display:flex;flex-direction:column;align-items:center;min-height:50px;justify-content:center;min-width:0}
.dp small{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.dp[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink);font-weight:600}
.dp[aria-pressed="true"] small{color:var(--pill-ink);opacity:.8}
.pgrid{display:grid;gap:12px}
@media (min-width:900px){.pgrid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:start}}
.toggle-row{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.sw{appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{left:23px}
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:28px minmax(0,1fr) 50px 12px 50px 40px;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--hair)}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.prow input{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);text-align:center;width:100%;min-width:0;padding:0}
.prow .x{color:var(--faint);text-align:center;font-size:13px}
.prow .rm{border:0;background:none;color:var(--faint);min-height:40px;font-size:18px}
.handle{touch-action:none;border:0;background:none;color:var(--faint);padding:8px 0;cursor:grab;display:grid;place-items:center;user-select:none;-webkit-user-select:none}
.prow.dragging{background:var(--sunk);border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.18);position:relative;z-index:2}
.prow.dragging .handle{cursor:grabbing;color:var(--accent)}
.exr{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:10px 12px;background:var(--sunk);border-radius:12px;margin-bottom:6px;cursor:pointer;min-height:56px}
.exr b{display:block;font-weight:600}
.exr small{display:block;font-size:12px;color:var(--muted)}
.exr:focus-visible,.exhead:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.exopen{background:var(--surface);border-radius:12px;padding:12px;margin-bottom:6px;box-shadow:inset 0 0 0 2px var(--accent);display:flex;flex-direction:column;gap:10px}
.exhead{all:unset;display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:36px}
.exhead b{font-weight:600}
.exgrp{font-size:13px;color:var(--muted);margin:14px 0 6px}
.chev{color:var(--faint)}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair)}
.exrow .nmi{grid-column:1/-1}
.exrow .nostep{font-size:13px;color:var(--faint);text-align:center}
.exrow:last-child{border-bottom:0}
.exrow .inp{min-height:40px;font-weight:600}
.exrow select.inp{font-weight:400;font-size:14px;padding:6px 8px}
.help{font-size:13px;color:var(--muted);margin:4px 0 0}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:16px 0 12px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills button{border:0;background:var(--surface);border-radius:999px;padding:8px 14px;white-space:nowrap;min-height:40px}
.pills button[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink);font-weight:600}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero .lbl{font-size:13px;color:var(--hero-muted)}
.hero .val{font-family:var(--display);font-weight:800;font-size:46px;line-height:1}
.gain{font-size:13px;font-weight:600;background:var(--pr);color:#3D2C00;border-radius:999px;padding:5px 10px;white-space:nowrap}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;align-items:end;height:150px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bars i{display:block;width:100%;border-radius:8px;background:var(--hero-bar);min-height:6px}
.bars i.best{background:var(--pr)}
.bars i.last{background:var(--accent)}
.bars em{font-style:normal;font-size:11px;color:var(--hero-muted);white-space:nowrap}
.bars span{font-size:11px;color:var(--hero-muted);white-space:nowrap}
.sess{padding:12px 0;border-bottom:1px solid var(--hair);display:flex;flex-direction:column;gap:8px}
.sess:last-child{border-bottom:0}
.sess-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.sess-h b{font-weight:600}
.sess-f{display:flex;justify-content:flex-end;margin-top:-6px}
.sess-f .link{min-height:36px;font-size:13px}
.sess-h span{font-size:13px;color:var(--muted)}
.sess-h .up{color:var(--done-text)}
.sess-h .down{color:var(--warn)}

<script>
(function(){
'use strict';
const APP_VERSION=14, KG_LB=2.20462, SDK='https://www.gstatic.com/firebasejs/10.14.1/';
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], ORDER=[1,2,3,4,5,6,0];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const SESSION_MS=3*60*60*1000, AWAY_MS=30*60*1000;
const STEPS_KG=[1,1.25,2,2.5,5], STEPS_LB=[2.5,5,10];
const TYPES={weight:'Weights',reps:'Bodyweight',time:'Timed'};
const TYPE_HELP='Weights: kg × reps (barbell, dumbbell, machine). Bodyweight: reps, extra weight optional (pull-ups, dips). Timed: seconds (plank).';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const newId=()=>Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,7);
const dname=s=>DAYS[parse(s).getDay()];
const fmtDate=s=>dname(s)+' '+s;
const num=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>ymd(new Date());
const I={
  check:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>',
  gear:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  trophy:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>',
  grip:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>'
};

/* ---------------- state ---------------- */
let plan, days={};
let view='today', viewKey=today(), weekOff=0, active={}, editor=null, addOpen=false, noteOpen=null, sheet=false;
let planDay=new Date().getDay(), progEx=null, pendingRender=false, planEditing=false, editSnap=null, exOpen=null, askState=null, bkCloudList=null;
function emptyWeek(){const w={};for(let i=0;i<7;i++)w[i]={name:'',rest:false,items:[]};return w}
function normPlan(p){
  p=p||{};const o={v:3,unit:p.unit==='lb'?'lb':'kg',theme:(p.theme==='light'||p.theme==='dark')?p.theme:'auto',startedOn:p.startedOn||null,library:{},week:emptyWeek()};
  Object.entries(p.library||{}).forEach(([k,v])=>{if(v&&typeof v==='object')o.library[k]={name:String(v.name||'Exercise'),type:TYPES[v.type]?v.type:'weight',note:String(v.note||''),archived:!!v.archived,step:num(v.step)||null}});
  for(let i=0;i<7;i++){const w=(p.week||{})[i];if(w)o.week[i]={name:String(w.name||''),rest:!!w.rest,items:(w.items||[]).filter(x=>x&&x.ex).map(x=>({ex:x.ex,sets:x.sets||3,reps:x.reps||10}))}}
  return o;
}
function normDay(d){d=d||{};return {title:typeof d.title==='string'?d.title:null,plan:Array.isArray(d.plan)?d.plan:null,skip:Array.isArray(d.skip)?d.skip:[],extra:Array.isArray(d.extra)?d.extra:[],sets:d.sets||{},rows:d.rows||{},off:!!d.off}}
const hasContent=p=>Object.keys(p.library).length>0;

/* ---------------- units ---------------- */
const toU=kg=>kg==null?null:(plan.unit==='lb'?kg*KG_LB:kg);
const fromU=v=>v==null?null:(plan.unit==='lb'?v/KG_LB:v);
function fw(kg){const v=toU(kg);if(v==null)return '';const m=plan.unit==='lb'?10:100;return String(Math.round(v*m)/m)}
function exStep(id){const e=plan.library[id];return e&&e.step?e.step:(plan.unit==='lb'?5/KG_LB:2.5)}
function stepU(id){const m=plan.unit==='lb'?10:100;return Math.round(toU(exStep(id))*m)/m}

/* ---------------- local storage ---------------- */
const LS={get(k){try{return JSON.parse(localStorage.getItem('wt3:'+k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem('wt3:'+k,JSON.stringify(v));return true}catch(e){toast('Phone storage is full. Save a backup in Settings.');return false}}};
function getSession(){return LS.get('session')}
function sessionDay(){const se=getSession();if(!se||se.finished)return null;if(Date.now()-se.last>SESSION_MS)return null;return se.date<today()?se.date:null}
function sessionActive(d){const se=getSession();return !!(se&&!se.finished&&se.date===d&&Date.now()-se.last<=SESSION_MS)}
function homeDay(){return sessionDay()||today()}
function bumpSession(d){const se=getSession();if(d===today()||(se&&!se.finished&&se.date===d&&Date.now()-se.last<=SESSION_MS)){LS.set('session',{date:d,last:Date.now(),finished:false})}}
function finishSession(){const se=getSession();if(se){se.finished=true;LS.set('session',se)}}
let lt=null;
function saveLocal(){clearTimeout(lt);lt=setTimeout(()=>{LS.set('plan',plan);LS.set('days',days);LS.set('pending',{days:[...dirtyDays],replace:[...replaceDays],plan:planDirty,all:replaceAll})},250)}

/* ---------------- cloud sync ---------------- */
const cfg=window.FIREBASE_CONFIG;
const fbOn=!!(cfg&&cfg.apiKey&&!/PASTE/i.test(cfg.apiKey));
let fb=null,fdb=null,user=null,unsubs=[],fbState=fbOn?'loading':'off';
const dirtyDays=new Set(),replaceDays=new Set(),editAt={};let planDirty=false,planEditAt=0,ct=null,replaceAll=false;
(function(){const p=LS.get('pending');if(p){(p.days||[]).forEach(d=>dirtyDays.add(d));(p.replace||[]).forEach(d=>replaceDays.add(d));planDirty=!!p.plan;replaceAll=!!p.all}})();
function savePlan(){planDirty=true;planEditAt=Date.now();saveLocal();flush()}
function touchDay(d,replace){dirtyDays.add(d);if(replace)replaceDays.add(d);editAt[d]=Date.now();saveLocal();flush()}
function flush(){clearTimeout(ct);ct=setTimeout(()=>{
  if(!user||!fdb)return;const base='users/'+user.uid;
  if(planDirty){planDirty=false;fdb.doc(base+'/meta/plan').set(clone(plan)).catch(syncErr)}
  dirtyDays.forEach(d=>{const x=days[d];if(!x)return;const ref=fdb.doc(base+'/days/'+d);(replaceDays.has(d)?ref.set(clone(x)):ref.set(clone(x),{merge:true})).catch(syncErr)});
  dirtyDays.clear();replaceDays.clear();saveLocal();
},500)}
function syncErr(e){console.error(e);toast(e&&e.code==='permission-denied'?'Sync refused. Check the Firestore rules.':'Sync problem. Your data is safe on this device.')}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function initFirebase(){
  if(!fbOn)return;
  try{
    await loadScript(SDK+'firebase-app-compat.js');
    await loadScript(SDK+'firebase-auth-compat.js');
    await loadScript(SDK+'firebase-firestore-compat.js');
    fb=window.firebase;fb.initializeApp(cfg);fdb=fb.firestore();
    try{await fdb.enablePersistence({synchronizeTabs:true})}catch(e){}
    fbState='ready';
    fb.auth().getRedirectResult().catch(e=>toast(authMsg(e)));
    fb.auth().onAuthStateChanged(u=>{user=u;unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];if(u)startSync();softRender()});
  }catch(e){fb=null;fbState='failed';softRender()}
}
function authMsg(e){const c=e&&e.code||'';if(c==='auth/unauthorized-domain')return 'Add this site in Firebase: Authentication, Settings, Authorized domains.';if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return 'Sign-in closed.';if(c==='auth/network-request-failed')return 'No internet. Sign in when you are online.';return 'Sign-in failed. Try again.'}
function signIn(){if(!fb){toast(fbState==='failed'?'Sync needs internet the first time. Try again online.':'Still connecting. Try again in a moment.');return}
  const p=new fb.auth.GoogleAuthProvider();
  fb.auth().signInWithPopup(p).catch(e=>{if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))return fb.auth().signInWithRedirect(p);toast(authMsg(e))});
}
function doneCount(x){let n=0;Object.values(x.sets||{}).forEach(a=>(a||[]).forEach(s=>{if(s&&s.done)n++}));return n}
async function startSync(){
  const base='users/'+user.uid,pRef=fdb.doc(base+'/meta/plan'),dCol=fdb.collection(base+'/days');
  try{
    const [ps,ds]=await Promise.all([pRef.get(),dCol.get()]);
    const prevUid=LS.get('synced'),first=prevUid!==user.uid;
    if(prevUid&&first&&(hasContent(plan)||Object.keys(days).length)&&(await ask({title:'Workouts from another account',msg:'This device has workouts from a different Google account.',buttons:[{v:'copy',label:'Copy them into this account',style:'primary'},{v:'clean',label:'Start clean on this device'}]}))!=='copy'){
      plan=normPlan();days={};dirtyDays.clear();replaceDays.clear();planDirty=false;replaceAll=false;LS.set('session',null)}
    const cloud={};ds.forEach(doc=>{cloud[doc.id]=normDay(doc.data())});
    if(replaceAll){
      const b=fdb.batch();let n=0;Object.keys(cloud).forEach(d=>{if(!days[d]){b.delete(dCol.doc(d));n++}});if(n)await b.commit();
      Object.keys(days).forEach(d=>{dirtyDays.add(d);replaceDays.add(d)});planDirty=true;replaceAll=false;
      LS.set('synced',user.uid);saveLocal();flush();render();
    }else{
    if(ps.exists){
      const cp=normPlan(ps.data());
      if(planDirty&&!first){/* local plan edits made while signed out win */}
      else if(first&&hasContent(plan)&&JSON.stringify(cp)!==JSON.stringify(plan)&&(await ask({title:'Two different plans',msg:'Your account already has a plan, and this device has another one.',buttons:[{v:'account',label:'Use the plan from my account',style:'primary'},{v:'device',label:'Keep this device’s plan'}]}))==='device'){planDirty=true}
      else{plan=cp;planDirty=false}
    }else if(hasContent(plan))planDirty=true;
    Object.keys(days).forEach(d=>{if(!cloud[d])dirtyDays.add(d)});
    Object.entries(cloud).forEach(([d,v])=>{
      if(dirtyDays.has(d)&&days[d])return;
      if(first&&days[d]&&doneCount(days[d])>doneCount(v)){dirtyDays.add(d);return}
      days[d]=v;
    });
    LS.set('synced',user.uid);applyTheme(plan.theme);saveLocal();flush();autoBackup();render();
    }
  }catch(e){toast('Could not reach your account. Working offline.')}
  unsubs.push(pRef.onSnapshot(s=>{if(s.metadata.hasPendingWrites||!s.exists||planDirty||Date.now()-planEditAt<4000)return;plan=normPlan(s.data());applyTheme(plan.theme);saveLocal();softRender()},()=>{}));
  unsubs.push(dCol.onSnapshot(q=>{let ch=false;q.docChanges().forEach(c=>{const id=c.doc.id;if(c.doc.metadata.hasPendingWrites||dirtyDays.has(id)||Date.now()-(editAt[id]||0)<4000)return;ch=true;if(c.type==='removed')delete days[id];else days[id]=normDay(c.doc.data())});if(ch){saveLocal();softRender()}},()=>{}));
}

/* ---------------- data helpers ---------------- */
const ex=id=>plan.library[id];
const exName=id=>ex(id)?ex(id).name:'Exercise';
const exType=id=>ex(id)?ex(id).type:'weight';
function getDay(d,create){if(!days[d]){if(!create)return null;days[d]=normDay()}return days[d]}
function weekItems(d){const w=plan.week[parse(d).getDay()];return w&&!w.rest?w.items.filter(i=>ex(i.ex)&&!ex(i.ex).archived):[]}
function dayPlan(d){const x=days[d];return x&&x.plan?x.plan.filter(i=>ex(i.ex)):weekItems(d)}
function snap(d){const x=getDay(d,true);if(!x.plan){x.plan=clone(weekItems(d));x.title=plan.week[parse(d).getDay()].name||''}return x}
function plannedItems(d){const x=days[d],p=dayPlan(d),extra=x?x.extra.filter(e=>ex(e.ex)&&!p.some(i=>i.ex===e.ex)):[],t0=today();
  return p.concat(extra).filter(i=>!(ex(i.ex).archived&&d>=t0&&!doneSets(d,i.ex).length))}
function visibleItems(d){const x=days[d],sk=x?x.skip:[];return plannedItems(d).filter(i=>!sk.includes(i.ex))}
function rowsFor(d,it){const x=days[d],s=(x&&x.sets[it.ex])||[];return (x&&x.rows[it.ex])||Math.max(s.length,it.sets||3)}
function valid(t,s){if(!s||!s.done)return false;if(t==='time')return s.t!=null;if(t==='reps')return s.r!=null;return s.w!=null&&s.r!=null}
function doneSets(d,id){const x=days[d],t=exType(id);return x&&x.sets[id]?x.sets[id].filter(s=>valid(t,s)):[]}
const isOff=d=>!!(days[d]&&days[d].off);
function stats(d){let p=0,n=0;if(isOff(d))return{p,n};plannedItems(d).forEach(it=>{const r=Math.max(rowsFor(d,it),it.sets||3);p+=r;n+=Math.min(r,doneSets(d,it.ex).length)});return{p,n}}
const started=d=>!!plan.startedOn&&d>=plan.startedOn;
const needsWork=d=>started(d)&&!isOff(d)&&plannedItems(d).length>0;
function complete(d){const s=stats(d);return s.p>0&&s.n>=Math.ceil(s.p/2)}
function streak(){let n=complete(today())?1:0;for(let i=1;i<1500;i++){const k=ymd(addDays(new Date(),-i));if(!started(k))break;if(complete(k)){n++;continue}if(needsWork(k))break}return n}
function weekDates(off){const t=new Date();const mon=addDays(t,-((t.getDay()+6)%7)+off*7);return [0,1,2,3,4,5,6].map(i=>ymd(addDays(mon,i)))}
function sessions(id,before){return Object.keys(days).sort().filter(d=>!before||d<before).map(d=>({d,sets:doneSets(d,id)})).filter(x=>x.sets.length)}
const key=(t,s)=>t==='time'?[s.t]:t==='reps'?[s.r,s.w||0]:[s.w,s.r];
function better(t,a,b){if(!a)return false;if(!b)return true;const x=key(t,a),y=key(t,b);for(let i=0;i<x.length;i++){if(x[i]>y[i]+1e-9)return true;if(x[i]<y[i]-1e-9)return false}return false}
function top(t,arr){let b=null;arr.forEach(s=>{if(better(t,s,b))b=s});return b}
function fmtSet(t,s){if(!s)return '';if(t==='time')return s.t+' s';if(t==='reps')return s.r+' reps'+(s.w?' +'+fw(s.w)+' '+plan.unit:'');return fw(s.w)+' '+plan.unit+' × '+s.r}
function listTxt(t,list){
  if(!list||!list.length)return '';
  if(t==='time')return list.map(s=>s.t).join(', ')+' s';
  if(t==='reps'){const w=Math.max(0,...list.map(s=>s.w||0));return list.map(s=>s.r).join(', ')+' reps'+(w?' +'+fw(w)+' '+plan.unit:'')}
  const same=list.every(s=>Math.abs(s.w-list[0].w)<1e-6);

function goalTxt(t,it){return (it.sets||3)+' × '+(it.reps||10)+(t==='time'?' s':'')}
function goalFor(id){for(const i of ORDER){const it=plan.week[i].items.find(x=>x.ex===id);if(it)return it.reps}return null}
function targets(id,it,d,rows){

  const last=ss[ss.length-1].sets,L=i=>last[Math.min(i,last.length-1)],list=[];let why;

  }else if(t==='reps'){
    const hit=last.length>=n&&last.every(s=>s.r>=goal);
    for(let i=0;i<rows;i++){const s=L(i);list.push({r:hit?s.r+1:(s.r>=goal?s.r:s.r+1),w:s.w||null})}
    why=hit?'One more rep on every set.':'One more rep where you fell short.';

    if(valid(t,prev)&&(!list[i-1]||!same(prev,list[i-1])||!list[i]))carry={w:prev.w,r:prev.r,t:prev.t};

function plateau(id,at){

  if(recent.length<3||!older.length)return false;
  return !better(t,top(t,recent.map(x=>top(t,x.sets))),top(t,older.map(x=>top(t,x.sets))));
}
function prs(d){const out=[];visibleItems(d).forEach(it=>{const id=it.ex,t=exType(id),tp=top(t,doneSets(d,id));if(!tp)return;const prev=sessions(id,d);if(!prev.length)return;const best=top(t,prev.map(x=>top(t,x.sets)));
  if(better(t,tp,best)){let diff;if(t==='weight'&&tp.w>best.w+1e-9)diff='up '+fw(tp.w-best.w)+' '+plan.unit+' on your best';else if(t==='time')diff='up '+(tp.t-best.t)+' s on your best';else diff='more reps than your best';out.push({id,t,tp,diff})}});return out}

function mergeEx(from,to){
  Object.entries(days).forEach(([d,x])=>{let ch=false;
    if(x.sets[from]){x.sets[to]=(x.sets[to]||[]).concat(x.sets[from]);delete x.sets[from];ch=true}
    if(x.rows[from]!=null){delete x.rows[from];if(x.sets[to])x.rows[to]=Math.max(x.rows[to]||0,x.sets[to].length);ch=true}
    if(x.skip.includes(from)){x.skip=x.skip.filter(i=>i!==from);ch=true}
    ['extra','plan'].forEach(k=>{if(Array.isArray(x[k])&&x[k].some(i=>i.ex===from)){x[k].forEach(i=>{if(i.ex===from)i.ex=to});x[k]=x[k].filter((e,i,a)=>a.findIndex(z=>z.ex===e.ex)===i);ch=true}});

    case 'note':noteOpen=id;render();{const n=$('#noteIn');n&&n.focus()}return;
    case 'noteclose':noteOpen=null;break;
    case 'openadd':addOpen=true;render();{const n=$('#addName');n&&n.focus()}return;
    case 'closeadd':addOpen=false;break;
    case 'addday':{const nid=ensureEx($('#addName').value,$('#addType').value);if(!nid){$('#addName').focus();return}
      if(!plan.startedOn)plan.startedOn=today();const x=snap(d);x.skip=x.skip.filter(i=>i!==nid);
      if(visibleItems(d).some(i=>i.ex===nid)){toast(exName(nid)+' is already on this day.');addOpen=false;active[d]=nid;break}
      if(!plannedItems(d).some(i=>i.ex===nid))x.extra.push({ex:nid,sets:Math.max(1,Math.round(num($('#addSets').value)||3)),reps:Math.max(1,Math.round(num($('#addReps').value)||10))});
      active[d]=nid;addOpen=false;savePlan();touchDay(d);break}
    case 'off':if(d!==today())return;snap(d).off=true;touchDay(d);break;
    case 'unoff':snap(d).off=false;touchDay(d);break;
    case 'pick':viewKey=b.dataset.d;editor=null;addOpen=false;noteOpen=null;break;
    case 'today':viewKey=today();weekOff=0;editor=null;addOpen=false;break;
    case 'wkprev':weekOff--;break;
    case 'wknext':if(weekOff<0)weekOff++;break;
    case 'goplan':view='plan';planDay=new Date().getDay();startEdit();break;
    case 'editweek':startEdit();window.scrollTo(0,0);break;
    case 'exedit':startEdit();exOpen=id;render();{const el=document.querySelector('[data-exbox="'+id+'"]');el&&el.scrollIntoView({block:'center'})}return;
    case 'exopen':{const y=b.getBoundingClientRect().top;exOpen=exOpen===id?null:id;render();const el=document.querySelector('[data-exbox="'+id+'"]')||document.querySelector('.exr[data-ex="'+id+'"]');if(el)window.scrollBy(0,el.getBoundingClientRect().top-y);return}
    case 'extype':{const want=b.dataset.v;if(want===exType(id))return;const n=sessions(id).reduce((a,x)=>a+x.sets.length,0);
      const go=()=>withUndo('Type changed.',()=>{plan.library[id].type=want;savePlan()});
      if(n)confirmAsk('Change the type?',exName(id)+' has '+n+' logged sets. Changing the type changes how they show.','Change type','primary').then(ok=>{if(ok)go()});else go();return}
    case 'exstep':plan.library[id].step=num(b.dataset.v);savePlan();break;
    case 'doneedit':finishEdit();window.scrollTo(0,0);break;
    case 'canceledit':{const sn=editSnap;planEditing=false;editSnap=null;if(sn&&(JSON.stringify(sn.plan)!==JSON.stringify(plan)||JSON.stringify(sn.days)!==JSON.stringify(days))){restoreSnap(sn);toast('Changes discarded.')}window.scrollTo(0,0);break}
    case 'pday':planDay=+b.dataset.d;break;
    case 'padd':{const nid=ensureEx($('#pName').value,$('#pType').value);if(!nid){$('#pName').focus();return}
      if(!plan.startedOn)plan.startedOn=today();const w=plan.week[planDay];
      if(w.items.some(i=>i.ex===nid)){toast(exName(nid)+' is already on '+DAYS[planDay]+'.');return}
      w.items.push({ex:nid,sets:Math.max(1,Math.round(num($('#pSets').value)||3)),reps:Math.max(1,Math.round(num($('#pReps').value)||10))});
      savePlan();render();{const p=$('#pName');p&&p.focus()}toast(exName(nid)+' added to '+DAYS[planDay]+'.',()=>restoreSnap(snap0));return}
    case 'rm':plan.week[planDay].items.splice(+b.dataset.i,1);savePlan();break;
    case 'archive':confirmAsk('Archive '+exName(id)+'?','It leaves your plan. Its history stays in Progress, and you can restore it.','Archive').then(ok=>{if(ok)withUndo('Archived '+exName(id)+'.',()=>{Object.values(plan.week).forEach(w=>{w.items=w.items.filter(i=>i.ex!==id)});plan.library[id].archived=true;savePlan()})});return;
    case 'restore':plan.library[id].archived=false;savePlan();toast(exName(id)+' restored. Add it to a day in your plan.');break;
    case 'pex':progEx=id;break;
    case 'delsess':{const dd=b.dataset.d,x=days[dd];if(!x||!x.sets[id])return;const n=doneSets(dd,id).length;
      confirmAsk('Delete this session?',exName(id)+' on '+fmtDate(dd)+', '+n+(n===1?' set':' sets')+'. Your plan and other exercises stay.','Delete session').then(ok=>{if(ok)withUndo('Session deleted.',()=>{delete x.sets[id];delete x.rows[id];touchDay(dd,true)})});return}
    case 'theme':plan.theme=b.dataset.v;applyTheme(plan.theme);savePlan();break;
    case 'unit':plan.unit=b.dataset.v;savePlan();break;
    case 'signin':signIn();return;
    case 'signout':if(!fb)return;
      ask({title:'Sign out?',msg:'Your workouts stay safe in your account either way.',buttons:[{v:'keep',label:'Sign out, keep workouts on this device',style:'primary'},{v:'wipe',label:'Sign out and remove them from this device',style:'danger'},{v:'cancel',label:'Cancel'}]}).then(v=>{if(v==='cancel')return;const wipe=v==='wipe';
        fb.auth().signOut().then(()=>{if(wipe){['plan','days','pending','synced','session','bk','bkCloud'].forEach(k=>localStorage.removeItem('wt3:'+k));plan=normPlan();days={};dirtyDays.clear();replaceDays.clear();planDirty=false;active={};viewKey=today();bkCloudList=null;toast('Signed out. This device is clear.')}else toast('Signed out. Your workouts stay on this device.');bkCloudList=null;render()})});return;
    case 'export':exportData();return;
    case 'share':shareData();return;
    case 'bkrestore':restoreBackup(b.dataset.src,b.dataset.d);return;
    case 'import':$('#impfile').click();return;
    default:return;
  }
  render();
  if(snap0&&JSON.stringify(snap0)!==JSON.stringify(takeSnap()))toast(UNDO_MSG[a],()=>restoreSnap(snap0));
}

/* ---------------- backup ---------------- */
function backupJson(){return JSON.stringify({app:'workout-tracker',v:3,saved:new Date().toISOString(),plan,days})}
function exportData(){
  const f='workout-backup-'+today()+'.json';
  try{const u=URL.createObjectURL(new Blob([backupJson()],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download=f;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
    toast('Saved to your Downloads folder: '+f)}catch(e){toast('Could not save the file. Try Share backup file instead.')}
}
function shareFile(){const f='workout-backup-'+today()+'.txt';try{return new File([backupJson()],f,{type:'text/plain'})}catch(e){return null}}
function canShareFile(){try{const x=shareFile();return !!(x&&navigator.canShare&&navigator.canShare({files:[x]}))}catch(e){return false}}
function shareData(){const x=shareFile();if(!x||!canShareFile()){toast('Sharing files isn’t available here. Use Save backup file.');return}
  navigator.share({files:[x],title:x.name}).then(()=>toast('Backup shared.')).catch(e=>{if(e&&e.name==='AbortError')toast('Sharing cancelled.');else toast('Could not share. Use Save backup file.')})}
function importData(d){
  if(!d||d.app!=='workout-tracker')throw 0;
  confirmAsk('Load this backup?','Everything goes back to the backup from '+String(d.saved||'').slice(0,10)+', on this device and online. You can undo right after.','Load backup').then(ok=>{if(!ok)return;
    try{withUndo('Backup loaded.',()=>applyData(d));view='today'}catch(x){toast('That file is not a workout backup.')}render()});
}
function applyData(d){
  let np,nd={};
  if(d.v===3&&d.plan&&d.days){np=normPlan(d.plan);Object.entries(d.days).forEach(([k,v])=>{nd[k]=normDay(v)})}
  else if(d.plan&&d.logs){
    const op=d.plan,lb=op.unit==='lb',p={unit:op.unit,theme:op.theme,library:{},week:op.week};
    Object.entries(op.library||{}).forEach(([k,name])=>{p.library[k]={name:String(name),type:(op.types||{})[k]||'weight',note:(op.notes||{})[k]||''}});
    np=normPlan(p);
    Object.values(d.logs||{}).forEach(m=>Object.entries(m||{}).forEach(([k,v])=>{const x=normDay(v);x.plan=null;
      Object.keys(x.sets).forEach(id=>{x.sets[id]=(x.sets[id]||[]).filter(s=>s&&typeof s==='object').map(s=>({w:s.w==null?null:(lb?s.w/KG_LB:s.w),r:s.r==null?null:s.r,t:s.t==null?null:s.t,done:!!s.done}))});
      nd[k]=x}));
  }else throw 0;
  const old=Object.keys(days);plan=np;days=nd;
  if(d.logs)Object.keys(days).forEach(k=>{days[k].plan=clone(weekItems(k))});
  const ds=Object.keys(days).sort();if(!plan.startedOn)plan.startedOn=ds[0]||(hasContent(plan)?today():null);
  old.forEach(k=>{if(!days[k])days[k]=normDay()});
  applyTheme(plan.theme);LS.set('session',null);savePlan();Object.keys(days).forEach(k=>{dirtyDays.add(k);replaceDays.add(k)});saveLocal();flush();viewKey=today();
}
/* ---------------- automatic backups ---------------- */
const BK_KEEP=7;
function setsCount(dd){let n=0;Object.values(dd||{}).forEach(x=>Object.values((x&&x.sets)||{}).forEach(a=>(a||[]).forEach(s=>{if(s&&s.done)n++})));return n}
function autoBackup(){
  if(!hasContent(plan))return;const t=today(),list=LS.get('bk')||[];
  if(!list.length||list[0].date!==t){
    list.unshift({date:t,sets:setsCount(days),data:{app:'workout-tracker',v:3,saved:new Date().toISOString(),plan:clone(plan),days:clone(days)}});
    while(list.length>BK_KEEP)list.pop();while(list.length>1&&JSON.stringify(list).length>2000000)list.pop();LS.set('bk',list);
  }
  if(user&&fdb&&LS.get('bkCloud')!==list[0].date)cloudBackup(list[0]);
}
function cloudBackup(b){const js=JSON.stringify(b.data);if(js.length>900000)return;const col=fdb.collection('users/'+user.uid+'/backups');
  col.doc(b.date).set({date:b.date,sets:b.sets,json:js}).then(()=>{LS.set('bkCloud',b.date);bkCloudList=null;return col.orderBy('date','desc').get()}).then(q=>{if(q)q.docs.slice(BK_KEEP).forEach(x=>x.ref.delete())}).catch(()=>{})}
function loadCloudBackups(){if(!user||!fdb||bkCloudList)return;bkCloudList='loading';
  fdb.collection('users/'+user.uid+'/backups').orderBy('date','desc').limit(BK_KEEP).get().then(q=>{bkCloudList=q.docs.map(x=>x.data());if(view==='settings')softRender()}).catch(()=>{bkCloudList=[]})}
function backupList(){if(user&&Array.isArray(bkCloudList)&&bkCloudList.length)return bkCloudList.map(b=>({date:b.date,sets:b.sets,src:'cloud'}));return (LS.get('bk')||[]).map(b=>({date:b.date,sets:b.sets,src:'local'}))}
function restoreBackup(src,date){
  const go=data=>confirmAsk('Restore '+fmtDate(date)+'?','Everything goes back to how it was when you opened the app that day, on this device and online. You can undo right after.','Restore').then(ok=>{if(ok)withUndo('Backup restored.',()=>applyData(data))});
  if(src==='local'){const b=(LS.get('bk')||[]).find(x=>x.date===date);if(b)go(b.data);return}
  const b=(bkCloudList||[]).find(x=>x.date===date);if(b){try{go(JSON.parse(b.json))}catch(e){toast('That backup could not be read.')}}
}
/* ---------------- drag to reorder ---------------- */
let drag=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.handle');if(!h)return;e.preventDefault();const row=h.closest('.prow');drag={row,list:row.parentElement};row.classList.add('dragging');try{h.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();const rows=[...drag.list.querySelectorAll('.prow')].filter(r=>r!==drag.row);let before=null;for(const r of rows){const bb=r.getBoundingClientRect();if(e.clientY<bb.top+bb.height/2){before=r;break}}
  if(before){if(drag.row.nextElementSibling!==before)drag.list.insertBefore(drag.row,before)}else if(rows.length){const last=rows[rows.length-1];if(last.nextElementSibling!==drag.row)last.after(drag.row)}},{passive:false});
function endDrag(){if(!drag)return;const order=[...drag.list.querySelectorAll('.prow')].map(r=>+r.dataset.row),w=plan.week[planDay],old=w.items;drag=null;
  if(order.some((v,i)=>v!==i)){w.items=order.map(i=>old[i]).concat(old.filter((_,i)=>!order.includes(i)));savePlan()}render()}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',e=>{const h=e.target.closest&&e.target.closest('.handle');if(!h||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;e.preventDefault();
  const i=+h.dataset.i,j=e.key==='ArrowUp'?i-1:i+1,it=plan.week[planDay].items;if(j<0||j>=it.length)return;[it[i],it[j]]=[it[j],it[i]];savePlan();render();const n=document.querySelector('.handle[data-i="'+j+'"]');n&&n.focus()});

/* ---------------- start ---------------- */
plan=normPlan(LS.get('plan'));
Object.entries(LS.get('days')||{}).forEach(([k,v])=>{days[k]=normDay(v)});
viewKey=homeDay();applyTheme(plan.theme);autoBackup();render();initFirebase();
let lastDay=today(),hiddenAt=0;
setInterval(()=>{const t=today();if(t!==lastDay){if(viewKey===lastDay&&!sessionActive(lastDay))viewKey=t;lastDay=t;softRender()}},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}
  autoBackup();const t=today();if(hiddenAt&&Date.now()-hiddenAt>AWAY_MS){viewKey=homeDay();weekOff=0;editor=null;addOpen=false;noteOpen=null}else if(t!==lastDay&&viewKey===lastDay&&!sessionActive(lastDay))viewKey=t;lastDay=t;softRender()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
